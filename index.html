<style>
/* Layout: one narrow column read top to bottom like a church bulletin (same look as handeul-youtube-report) */
:root {
  --paper: #F7F4EC;
  --paper-raised: #EFE9D8;
  --ink: #17233F;
  --ink-soft: #5C6478;
  --line: #DCD3BE;
  --accent: #00704A;
  --accent-soft: #DCEBE2;
  --muted-bar: #C9C2AE;
  --font-display: 'Do Hyeon', 'Noto Sans KR', sans-serif;
  --font-body: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161F; --paper-raised: #1B2130; --ink: #ECE8DC; --ink-soft: #A7AEC1;
    --line: #2B3244; --accent: #8FB07E; --accent-soft: #24312A; --muted-bar: #3A4256;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.65;
  padding: 0 14px; margin: 0;
}
main { max-width: 680px; margin: 0 auto; padding-block: 20px 120px; display: grid; gap: 28px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font-size: 14px; color: var(--ink-soft); letter-spacing: .04em; }
.eyebrow a { color: var(--ink-soft); }
header { display: grid; gap: 12px; }
header h1 { font-size: clamp(32px, 6.5vw, 44px); padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.headline { font-family: var(--font-display); font-size: clamp(24px, 4.6vw, 30px); line-height: 1.3; text-wrap: balance; }
.headline em { font-style: normal; color: var(--accent); }
.lead { font-size: 19px; color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--paper-raised); border-radius: 14px; padding: 18px 16px; display: grid; gap: 4px; align-content: start; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 7vw, 44px); line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { font-size: 15px; color: var(--ink-soft); line-height: 1.4; }
@media (max-width: 520px) { .stats { grid-template-columns: 1fr; } .stat { grid-template-columns: auto 1fr; align-items: baseline; gap: 12px; } }

section { display: grid; gap: 16px; }
section h2 { font-size: 28px; }
section h3 { font-size: 18px; margin: 8px 0 0; font-weight: 700; }
.note { font-size: 15px; color: var(--ink-soft); }


/* ---- week page: mobile first ---- */
header.top { gap: 4px; }
header.top h1 { font-size: 26px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.long { gap: 8px; }
.long .thumb { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line); }
.long h2 { font-size: 28px; margin-top: 4px; }
.meta { font-size: 15px; color: var(--ink-soft); }
details.more { border: 1px solid var(--line); border-radius: 12px; background: var(--paper-raised); }
details.more > summary { list-style: none; cursor: pointer; padding: 11px 14px; font-weight: 700; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: '▾'; margin-left: auto; transition: transform .15s; }
details.more[open] > summary::after { transform: rotate(180deg); }
details.more > summary small { font-weight: 400; color: var(--ink-soft); font-size: 13px; }
.more-body { padding: 0 14px 14px; display: grid; gap: 12px; font-size: 14px; }
.more-body h3 { font-size: 16px; margin: 4px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 14px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 500; font-size: 14px; text-decoration: none; border: 1px solid var(--accent); }
.btn.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
.copy { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
.copy-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--paper-raised); font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.copy-head button { font: inherit; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--paper); border: 1px solid var(--accent); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
.copytext { padding: 10px 12px; font-size: 14px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
.copytext.pre { white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
.chapters { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
.chapters li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.chapters li:last-child { border-bottom: 0; }
.chapters .t { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

.sec-head { display: grid; gap: 2px; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { display: grid; gap: 6px; align-content: start; padding: 8px; border-radius: 14px; background: var(--paper-raised); border: 2px solid transparent; min-width: 0; }
.card.on { border-color: var(--accent); background: var(--accent-soft); }
.vid video { width: 100%; height: auto; aspect-ratio: 9 / 16; border-radius: 10px; background: #000; display: block; object-fit: cover; }
.c-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
.c-meta .num { font-family: var(--font-display); font-size: 22px; color: var(--accent); line-height: 1; }
.badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: 12px; }
.card.on .badge { background: var(--paper); }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; line-height: 1.3; margin: 0; word-break: keep-all; }
.c-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pick, .dl { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 4px; border-radius: 10px; text-align: center; text-decoration: none; cursor: pointer; white-space: nowrap; }
.pick { background: var(--paper); color: var(--accent); border: 2px solid var(--accent); }
.pick[aria-pressed="true"] { background: var(--accent); color: #fff; }
.dl { background: var(--paper); color: var(--ink); border: 2px solid var(--line); }
details.more.small > summary { padding: 7px 10px; font-size: 13px; }
details.more.small .more-body { padding: 0 10px 10px; font-size: 13px; gap: 8px; }
.caps-h { font-weight: 700; }
.caps { margin: 0; padding-left: 1.3em; color: var(--ink-soft); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
.bar-msg { flex: 1; font-size: 14px; color: var(--ink-soft); min-width: 0; }
.done { font: inherit; font-family: var(--font-display); font-size: 20px; padding: 10px 18px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
.done:disabled { background: var(--muted-bar); color: var(--paper); cursor: default; }
.toast { position: fixed; left: 14px; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 6; max-width: 560px; margin: 0 auto; padding: 16px; border-radius: 14px; background: var(--ink); color: var(--paper); display: grid; gap: 10px; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
.toast b { font-family: var(--font-display); font-weight: 400; font-size: 22px; display: block; }
.toast button { font: inherit; font-size: 14px; justify-self: end; background: transparent; color: var(--paper); border: 1px solid var(--paper); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---- weeks list (top page) ---- */
.weeks { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.weeks img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line); }
.weeks a { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px; border-radius: 14px; background: var(--paper-raised); color: var(--ink); text-decoration: none; }
.weeks .w-body { display: grid; gap: 2px; }
.weeks .date { font-size: 14px; color: var(--ink-soft); }
.weeks b { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.25; color: var(--accent); }
.sub-d { display: block; font-size: 14px; color: var(--ink-soft); }
@media (max-width: 520px) { .weeks a { grid-template-columns: 1fr; } }

footer { font-size: 13px; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; overflow-wrap: anywhere; }
footer a { color: var(--ink-soft); }
.more-body p.link { margin: 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: rgba(0,112,74,.06); border-radius: 0 8px 8px 0; }
.more-body p.link b { display: block; color: var(--accent); font-size: 12px; margin-bottom: 2px; }

</style>
</head>

    <p class="eyebrow">흥왕교회</p>

    </ol>

</main>
