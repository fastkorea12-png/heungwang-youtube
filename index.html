<style>
/* Layout: one narrow column read top to bottom like a church bulletin (same look as handeul-youtube-report) */
:root {
  --paper: #F7F4EC;
  --paper-raised: #EFE9D8;
  --ink: #17233F;
  --ink-soft: #5C6478;
  --line: #DCD3BE;
  --accent: #00704A;
  --accent-soft: #DCEBE2;
  --muted-bar: #C9C2AE;
  --font-display: 'Do Hyeon', 'Noto Sans KR', sans-serif;
  --font-body: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161F; --paper-raised: #1B2130; --ink: #ECE8DC; --ink-soft: #A7AEC1;
    --line: #2B3244; --accent: #8FB07E; --accent-soft: #24312A; --muted-bar: #3A4256;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.65;
  padding: 0 20px; margin: 0;
}
main { max-width: 680px; margin: 0 auto; padding-block: 48px 64px; display: grid; gap: 48px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font-size: 14px; color: var(--ink-soft); letter-spacing: .04em; }
.eyebrow a { color: var(--ink-soft); }
header { display: grid; gap: 12px; }
header h1 { font-size: clamp(32px, 6.5vw, 44px); padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.headline { font-family: var(--font-display); font-size: clamp(24px, 4.6vw, 30px); line-height: 1.3; text-wrap: balance; }
.headline em { font-style: normal; color: var(--accent); }
.lead { font-size: 19px; color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--paper-raised); border-radius: 14px; padding: 18px 16px; display: grid; gap: 4px; align-content: start; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 7vw, 44px); line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { font-size: 15px; color: var(--ink-soft); line-height: 1.4; }
@media (max-width: 520px) { .stats { grid-template-columns: 1fr; } .stat { grid-template-columns: auto 1fr; align-items: baseline; gap: 12px; } }

section { display: grid; gap: 16px; }
section h2 { font-size: 28px; }
section h3 { font-size: 18px; margin: 8px 0 0; font-weight: 700; }
.note { font-size: 15px; color: var(--ink-soft); }

.thumb { margin: 0; }
.thumb img, .weeks img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 500; font-size: 15px; text-decoration: none; border: 1px solid var(--accent); }
.btn.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
:root .btn:hover { filter: brightness(1.08); }

.copy { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
.copy-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--paper-raised); font-size: 14px; color: var(--ink-soft); font-weight: 500; }
.copy-head button { font: inherit; font-size: 14px; font-weight: 700; color: var(--accent); background: var(--paper); border: 1px solid var(--accent); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
.copy-head button.ok { background: var(--accent); color: #fff; }
.copytext { padding: 12px 14px; font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
.copytext.pre { white-space: pre-wrap; max-height: 340px; overflow-y: auto; }

.chapters { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.chapters li { display: grid; grid-template-columns: 4em minmax(0, 1fr); gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 15px; }
.chapters li:last-child { border-bottom: 0; }
.chapters .t { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

.shorts { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }
.short { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; padding: 16px; border-radius: 14px; background: var(--paper-raised); align-items: start; }
.short video { width: 100%; height: auto; aspect-ratio: 9 / 16; border-radius: 10px; background: #000; display: block; }
.short-body { display: grid; gap: 10px; align-content: start; min-width: 0; }
.short-body h3 { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.3; margin: 0; text-wrap: balance; }
.short-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }
.short-meta .num { font-family: var(--font-display); font-size: 26px; color: var(--accent); line-height: 1; }
.badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 13px; }
.hook { font-size: 15px; color: var(--ink-soft); }
.short-body .btn { justify-self: start; }
details { font-size: 14px; }
summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.caps { margin: 8px 0 0; padding-left: 1.4em; color: var(--ink-soft); display: grid; gap: 2px; }
@media (max-width: 560px) { .short { grid-template-columns: 1fr; } .short video { max-width: 300px; margin: 0 auto; } }

.weeks { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.weeks a { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px; border-radius: 14px; background: var(--paper-raised); color: var(--ink); text-decoration: none; }
.weeks .w-body { display: grid; gap: 2px; }
.weeks .date { font-size: 14px; color: var(--ink-soft); }
.weeks b { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.25; color: var(--accent); }
.sub-d { display: block; font-size: 14px; color: var(--ink-soft); }
@media (max-width: 520px) { .weeks a { grid-template-columns: 1fr; } }

footer { font-size: 14px; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; overflow-wrap: anywhere; }
footer a { color: var(--ink-soft); }

</style>
</head>

<main>
  <header>

    <h1>흥왕교회 주일설교 유튜브 자료</h1>
    <p class="lead">주일마다 유튜브에 올릴 롱폼 제목·설명·챕터와 숏츠를 한 페이지씩 정리합니다.</p>
  </header>

  <section aria-labelledby="h-weeks">
    <h2 id="h-weeks">주별 자료</h2>
    <ol class="weeks">
      <li><a href="261115/"><img src="261115/thumbnail.png" width="1280" height="720" alt=""><span class="w-body"><span class="date">2026년 11월 15일 주일</span><b>감사는 의심하지 않는 것이다</b><span class="sub-d">창세기 50장 15–21절 · 박 찬 담임목사 · 숏츠 6편</span></span></a></li>
    </ol>
  </section>
</main>
</body>
